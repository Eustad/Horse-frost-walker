name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: neoforge-1.21.x
            java: '21'
          - project: forge-1.20.1
            java: '17'
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: horsefrostwalker-${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar

  # Temporal: guarda los .jar en esta rama para poder descargarlos con git
  commit-jars:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
      - name: Commit jars
        run: |
          mkdir -p built && find jars -name '*.jar' | while read f; do cp "$f" "built/$(basename "$(dirname "$f")" | sed 's/horsefrostwalker-//')-$(basename "$f")"; done
          ls -la built
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -f built && git commit -m "jars" && git push
