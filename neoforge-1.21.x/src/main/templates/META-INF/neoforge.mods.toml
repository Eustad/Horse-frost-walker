modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Mod solo de servidor: los clientes sin el mod pueden conectarse igualmente
displayTest="IGNORE_ALL_VERSION"
description='''
Si montas a caballo con botas encantadas con Paso helado (Frost Walker), el caballo congela el agua bajo sus patas.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
